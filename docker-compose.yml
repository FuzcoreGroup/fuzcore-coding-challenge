services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: challenge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/challenge
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: dev-change-me
      JWT_EXPIRES_IN: 7d
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    # `node_modules` is mounted as a named volume in dev. If dependencies change,
    # we need to ensure the mounted volume has the latest packages.
    command: sh -c "npm ci && npm run db:push && npm run dev"

volumes:
  pgdata:
  node_modules:
